<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple To Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 50px;
        }

        .box {
            background-color: white;
            padding: 20px;
            width: 400px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 250px;
            padding: 5px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>To Do App</h1>
        
        <input type="text" id="todo" placeholder="Enter A Task">
        <button onclick="addTodo()">Add ToDo</button>
        
        <ul id="todolist"></ul>
    </div>

    <script>
        let arr = [];           
        let completedArr = [];  
        
        let task = document.getElementById("todo");
        let list = document.getElementById("todolist");

        
        function addTodo() {
            if (task.value == "") {
                alert("Please type something first!");
                return;
            }
            
            arr.push(task.value);       
            completedArr.push(false);   
            
            task.value = "";            
            renderTodo();               
        }

        
        function deleteTodo(index) {
            arr.splice(index, 1);          
            completedArr.splice(index, 1); 
            renderTodo();                  
        }

        
        function toggleComplete(index) {
            if (completedArr[index] == false) {
                completedArr[index] = true;
            } else {
                completedArr[index] = false;
            }
            renderTodo(); 
        }

        
        function updateTodo(index) {
            let newText = prompt("Change your task to:", arr[index]);
            
            if (newText != null && newText != "") {
                arr[index] = newText;
                renderTodo(); 
            }
        }


        function renderTodo() {
            list.innerHTML = ""; 
            arr.forEach(function(val, index) {
                
                let textClass = "";
                if (completedArr[index] == true) {
                    textClass = "done";
                }

               
                let itemHtml = "<li>" +
                    "<span class='" + textClass + "'>" + val + "</span> " +
                    "<button onclick='toggleComplete(" + index + ")'>Complete</button> " +
                    "<button onclick='updateTodo(" + index + ")'>Update</button> " +
                    "<button onclick='deleteTodo(" + index + ")'>Delete</button>" +
                "</li>";

               
                list.innerHTML = list.innerHTML + itemHtml;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Login</h1>
    <input type="text" name="" id="user" placeholder="Username">
    <br>
    <input type="password" name="" id="pass" placeholder="Password">
    <br>
    <button onclick="getData()">Login</button>
    <h1 id="msg"></h1>
    <script>
        
        function getData(){
           var msg = document.getElementById("msg");
           var a = document.getElementById("user");
           var b = document.getElementById("pass");
           var attempts = 3;
           console.log(a.value);
           console.log(b.value);
           msg.innerHTML = "hello " + a.value;
           if (attempts ==3){
           if(a.value == "admin" && b.value == "admin"){
               msg.innerHTML = "Login Successfull";
           }
           if (a.value != "admin" || b.value != "admin"){
               attempts--;
               msg.innerHTML = "Login Failed. Attempts left: " + attempts;
           }
            if (attempts == 0){
                msg.innerHTML = "No more attempts left. Please try again later and blocked for 15 minutes.";
            }
        }
        }
    </script>
</body>
</html>

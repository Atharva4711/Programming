<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Setup</title>
</head>
<body>

    <h1>Select a Password</h1>

    <script>
        let password = prompt("Enter your new password:");
        let hasValidLength = password.length >= 8;
        let hasUppercase   = /[A-Z]/.test(password);
        let hasNumber      = /\d/.test(password);
        let hasSpecialChar = /[\W_]/.test(password);

       
        console.log("--- Password Check Results ---");

        if (hasValidLength && hasUppercase && hasNumber && hasSpecialChar) {
           
            console.log("Success: All conditions met!");
        } 
        else {
            
            if (!hasValidLength) {
                console.log(" Missing: Must be at least 8 characters long.");
            }
            if (!hasUppercase) {
                console.log(" Missing: Must contain at least 1 uppercase letter.");
            }
            if (!hasNumber) {
                console.log(" Missing: Must contain at least 1 number.");
            }
            if (!hasSpecialChar) {
                console.log(" Missing: Must contain at least 1 special character (like !, @, #, $).");
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Task 6</h1>
    <script>
        var billAmount = parseFloat(prompt("Enter the total bill amount:"));
        if (billAmount >= 1000) {
            var discount = billAmount * 0.05;
            var finalAmount = billAmount - discount;
            console.log("Congratulations! You get a 10% discount.");
            console.log("Original Bill Amount: ₹" + billAmount.toFixed(2));
            console.log("Discount Amount: ₹" + discount.toFixed(2));
            console.log("Final Bill Amount after Discount: ₹" + finalAmount.toFixed(2));
        } 
        else if (billAmount >= 5000) {
            var discount = billAmount * 0.2;
            var finalAmount = billAmount - discount;
            console.log("Good news! You get a 20% discount.");
            console.log("Original Bill Amount: ₹" + billAmount.toFixed(2));
            console.log("Discount Amount: ₹" + discount.toFixed(2));
            console.log("Final Bill Amount after Discount: ₹" + finalAmount.toFixed(2));
        }
        else if (billAmount >= 3000) {
            var discount = billAmount * 0.1;
            var finalAmount = billAmount - discount;
            console.log("Amazing! You get a 10% discount.");
            console.log("Original Bill Amount: ₹" + billAmount.toFixed(2));
            console.log("Discount Amount: ₹" + discount.toFixed(2));
            console.log("Final Bill Amount after Discount: ₹" + finalAmount.toFixed(2));
        }
        else {
            console.log("No discount applied. Your bill amount is ₹" + billAmount.toFixed(2));
        }
    </script>
</body>
</html>

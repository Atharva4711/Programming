<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Grid Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121214;
            font-family: Arial, sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 240px;
            gap: 15px;
        }

        .text-panel {
            grid-column: 1 / 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px;
        }

        .text-panel h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .text-panel p {
            font-size: 18px;
            color: #8a8a93;
        }

        .block {
            background-color: #1e1e24;
            border-radius: 6px;
            overflow: hidden;
        }

        .block img {
            width: 90%;
            height: 100%;
            object-fit: cover;
        }

        .tall-block {
            grid-row: 1 / 3;
            grid-column: 3 / 4;
        }

        .wide-block {
            grid-column: 1 / 3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-panel">
            <h1>Grid System Showcase</h1>
            <p>A structural gallery displaying visual inspirations.</p>
        </div>

        <div class="block tall-block">
            <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?w=500" alt="Interface Presentation">
        </div>

        <div class="block">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" alt="Abstract Layout">
        </div>

        <div class="block">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" alt="Web Elements">
        </div>

        <div class="block wide-block">
            <img src="https://assets.visme.co/templates/blockinfographics/fullsize/i_Visual-Brand-Assets_full.jpg" alt="Graphic Design Assets">
        </div>
    </div>

</body>
</html>

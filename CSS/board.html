<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Full-Size Chessboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chessboard {
            width: 80vw;
            height: 80vw;
            max-width: 800px;
            max-height: 800px;
            border: 4px solid #ffffff;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .square {
            width: 100%;
            height: 100%;
        }

        .light {
            background-color: #eeeed2;
        }

        .dark {
            background-color: #769656;
        }
    </style>
</head>
<body>

    <div class="chessboard">
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>

        <div class="square dark"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
    </div>

</body>
</html>
